<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCP Pricing Calculator Agent</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #4285f4;
      --accent-hover: #5a9cf6;
      --green: #34a853;
      --red: #ea4335;
      --yellow: #fbbc04;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p { color: var(--muted); margin-top: .4rem; font-size: .95rem; }
    .container { width: 100%; max-width: 640px; padding: 0 1rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .4rem; }
    textarea {
      width: 100%;
      min-height: 80px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .75rem;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .examples { margin-top: .6rem; }
    .examples span {
      display: inline-block;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .3rem .6rem;
      margin: .25rem .25rem 0 0;
      font-size: .8rem;
      color: var(--muted);
      cursor: pointer;
      transition: .15s;
    }
    .examples span:hover { border-color: var(--accent); color: var(--text); }
    button#submit {
      margin-top: 1rem;
      width: 100%;
      padding: .75rem;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: .15s;
    }
    button#submit:hover { background: var(--accent-hover); }
    button#submit:disabled { opacity: .5; cursor: not-allowed; }

    #result {
      margin-top: 1.5rem;
      display: none;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .85rem;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--yellow);
      animation: pulse 1s ease-in-out infinite;
    }
    .dot.done { background: var(--green); animation: none; }
    .dot.fail { background: var(--red); animation: none; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    .cost-display {
      margin-top: 1rem;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--green);
      display: none;
    }
    .summary-text {
      margin-top: .8rem;
      font-size: .9rem;
      color: var(--muted);
      white-space: pre-wrap;
      line-height: 1.5;
      display: none;
    }
    .error-text {
      margin-top: .8rem;
      font-size: .9rem;
      color: var(--red);
      display: none;
    }
    footer {
      margin-top: 2rem;
      padding: 1rem;
      text-align: center;
      font-size: .75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>☁️ GCP Pricing Calculator Agent</h1>
    <p>Describe a GCP resource in plain English — an AI agent will price it for you.</p>
  </header>

  <div class="container">
    <div class="card">
      <label for="query">What do you want to price?</label>
      <textarea id="query" placeholder="e.g. &quot;2 vCPU, 8 GB RAM, 100 GB SSD in us-central1&quot;"></textarea>
      <div class="examples">
        <span onclick="fill(this)">2 vCPU 4 GB RAM Compute Engine</span>
        <span onclick="fill(this)">e2-standard-4 with 200 GB SSD</span>
        <span onclick="fill(this)">n1-standard-8 with T4 GPU</span>
      </div>
      <button id="submit" onclick="submitQuery()">Get Price Estimate</button>
    </div>

    <div class="card" id="result">
      <div class="status-bar">
        <div class="dot" id="dot"></div>
        <span id="statusText">Queued…</span>
      </div>
      <div class="cost-display" id="cost"></div>
      <div class="summary-text" id="summary"></div>
      <div class="error-text" id="error"></div>
    </div>
  </div>

  <footer>Powered by Gemini 2.5 &amp; Playwright &bull; FastAPI</footer>

  <script>
    function fill(el) { document.getElementById('query').value = el.textContent; }

    async function submitQuery() {
      const query = document.getElementById('query').value.trim();
      if (!query) return;

      const btn = document.getElementById('submit');
      btn.disabled = true;
      btn.textContent = 'Working…';

      const res = document.getElementById('result');
      res.style.display = 'block';
      const dot = document.getElementById('dot');
      const statusText = document.getElementById('statusText');
      const costEl = document.getElementById('cost');
      const summaryEl = document.getElementById('summary');
      const errorEl = document.getElementById('error');

      dot.className = 'dot';
      statusText.textContent = 'Queued…';
      costEl.style.display = 'none';
      summaryEl.style.display = 'none';
      errorEl.style.display = 'none';

      try {
        const resp = await fetch('/api/price', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        });
        const data = await resp.json();
        if (!resp.ok) { throw new Error(data.detail || 'Request failed'); }
        pollJob(data.job_id);
      } catch (e) {
        dot.className = 'dot fail';
        statusText.textContent = 'Error';
        errorEl.textContent = e.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Get Price Estimate';
      }
    }

    function pollJob(jobId) {
      const dot = document.getElementById('dot');
      const statusText = document.getElementById('statusText');
      const costEl = document.getElementById('cost');
      const summaryEl = document.getElementById('summary');
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('submit');

      const iv = setInterval(async () => {
        try {
          const r = await fetch(`/api/price/${jobId}`);
          const d = await r.json();

          statusText.textContent =
            d.status === 'parsing'       ? 'Parsing your request…' :
            d.status === 'running_agent' ? `Agent working… (${d.step_count} steps)` :
            d.status === 'done'          ? 'Done!' :
            d.status === 'failed'        ? 'Failed' : d.status;

          if (d.status === 'done') {
            clearInterval(iv);
            dot.className = 'dot done';
            costEl.textContent = d.monthly_cost || 'See summary';
            costEl.style.display = 'block';
            if (d.summary) { summaryEl.textContent = d.summary; summaryEl.style.display = 'block'; }
            btn.disabled = false;
            btn.textContent = 'Get Price Estimate';
          } else if (d.status === 'failed') {
            clearInterval(iv);
            dot.className = 'dot fail';
            errorEl.textContent = d.error || 'Unknown error';
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Get Price Estimate';
          }
        } catch (_) {}
      }, 2000);
    }
  </script>
</body>
</html>
